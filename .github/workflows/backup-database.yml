name: Backup base de datos

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Crear copia de seguridad PostgreSQL 18
        env:
          DATABASE_URL: ${{ secrets.RENDER_DATABASE_URL }}
        run: |
          FECHA=$(date -u +"%Y-%m-%d_%H-%M-%S")
          ARCHIVO="mantenimiento_db_${FECHA}.backup"

          docker run --rm \
            -e DATABASE_URL="$DATABASE_URL" \
            -v "$PWD:/backup" \
            postgres:18 \
            sh -c 'pg_dump \
              --dbname="$DATABASE_URL" \
              --format=custom \
              --no-owner \
              --no-privileges \
              --file="/backup/'"$ARCHIVO"'"'

          test -s "$ARCHIVO"

          echo "BACKUP_FILE=$ARCHIVO" >> "$GITHUB_ENV"

      - name: Guardar copia
        uses: actions/upload-artifact@v4
        with:
          name: backup-mantenimiento-${{ github.run_number }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30
          if-no-files-found: error
